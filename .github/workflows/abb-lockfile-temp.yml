name: Temporary ABB lockfile generation
on:
  push:
    branches:
      - codex/abb-discovery-copy
    paths:
      - .github/workflows/abb-lockfile-temp.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        run: npm install --no-audit --no-fund
      - name: Verify reproducible install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit generated lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock existing npm dependencies"
          git push origin HEAD:codex/abb-discovery-copy
